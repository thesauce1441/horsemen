  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #0a0a0a; color: #fff; font-family: sans-serif; }
    header { text-align: center; padding: 60px 20px 20px; }
    header h1 { font-size: 3rem; letter-spacing: 0.3em; text-transform: uppercase; }
    section { padding: 40px 20px; border-top: 1px solid #222; }
    section h2 { font-size: 1.2rem; letter-spacing: 0.2em; text-transform: uppercase; color: #888; margin-bottom: 6px; }
    .count { font-size: 0.8rem; color: #444; margin-bottom: 20px; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 4px; }
    .item img { width: 100%; height: 180px; object-fit: cover; cursor: pointer; display: block; transition: opacity 0.2s; }
    .item img:hover { opacity: 0.75; }
    #lightbox { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.96); z-index: 999; align-items: center; justify-content: center; }
    #lightbox.active { display: flex; }
    #lightbox img { max-width: 90vw; max-height: 90vh; object-fit: contain; }
    #lightbox-close { position: fixed; top: 20px; right: 30px; font-size: 2rem; cursor: pointer; color: #fff; line-height: 1; }
  </style>

    <span id="lightbox-close">&times;</span>
    <img id="lightbox-img" src="" alt="">
  </div>
  <script>
    function openLightbox(src) {
      document.getElementById('lightbox-img').src = src;
      document.getElementById('lightbox').classList.add('active');
    }
    function closeLightbox() {
      document.getElementById('lightbox').classList.remove('active');
      document.getElementById('lightbox-img').src = '';
    }
    document.addEventListener('keydown', e => { if (e.key === 'Escape') closeLightbox(); });
  </script>
